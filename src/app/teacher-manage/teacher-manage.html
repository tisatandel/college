<h2>Teacher List</h2>

<button
  type="button"
  class="btn btn-primary ms-2"
  (click)="editTeacher = null; openModal()">
  Add Teacher
</button>

<div class="modal fade" id="teacherModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ editTeacher === null ? 'Add Teacher' : 'Update Teacher' }}
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">
        <app-form
          [editData]="editTeacher"
          (added)="addTeacher($event); closeModal()"
          (updated)="updateTeacher($event); closeModal()">
        </app-form>
      </div>

    </div>
  </div>
</div>

<br /><br />

<app-table
  [data]="teachers$ | async"
  (edit)="teacher.editTeacher($event); openModal()"
  (delete)="teacher.deleteTeacher($event)">
</app-table>

<br />

<button class="btn btn-secondary" (click)="goToHome()">
  Back to Dashboard
</button>
