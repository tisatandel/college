<div class="container mt-4">
  <h2>Teacher Management</h2>
  <button class="btn btn-primary" (click)="editTeacher = null; openModal()">Add Teacher</button>

  <div class="modal fade" id="teacherModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editTeacher ? 'Update' : 'Add' }} Teacher</h5>
          <button class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
            @if (editTeacher) 
            {
            <app-form
              [editData]="editTeacher"
              (updated)="updateTeacher($event); closeModal()">
            </app-form>
            } @else {
            <app-form (added)="addTeacher($event); closeModal()"></app-form>
          }
        </div>
      </div>
    </div>
  </div>

  <app-table
  [data]="teachers$ | async"
  (edit)="edit($event)" 
  (delete)="deleteTeacher($event)">
</app-table>
</div>
