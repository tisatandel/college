<h2>Teacher List</h2>

<button
  type="button"
  class="btn btn-primary ms-2"
  (click)="teacher.addTeacher(); openModal()">
  Add Teacher
</button>

<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ teacher.editIndex === null ? 'Add Teacher' : 'Update Teacher' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-form
          [data]="teacher.data"
          [editIndex]="teacher.editIndex"
          (save)="teacher.saveTeacher($event); closeModal()">
        </app-form>
      </div>

    </div>
  </div>
</div>

<br /><br />

<app-table
  [data]="tableData"
  (edit)="teacher.editTeacher($event); openModal()"
  (delete)="teacher.deleteTeacher($event)">
</app-table>

<br />

<button class="btn btn-secondary" (click)="goToHome()">
  Back to Dashboard
</button>
