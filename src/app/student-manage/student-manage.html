<div class="container mt-4">
  <h2>Student Management</h2>
  <button class="btn btn-primary" (click)="editStudent = null; openModal()">Add Student</button>

  <div class="modal fade" id="teacherModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editStudent ? 'Update' : 'Add' }} Teacher</h5>
          <button class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
            @if (editStudent) 
            {
            <app-form
              [editData]="editStudent"
              (updated)="updateStudent($event); closeModal()">
            </app-form>
            } @else {
            <app-form (added)="addStudent($event); closeModal()"></app-form>
          }
        </div>
      </div>
    </div>
  </div>

  <app-table
  [data]="students$ | async"
  (edit)="edit($event)" 
  (delete)="deleteStudent($event)">
</app-table>
</div>
