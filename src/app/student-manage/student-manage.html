<h2>Student List</h2>

<button
  type="button"
  class="btn btn-primary ms-2"
  (click)="student.addStudent(); openModal()">
  Add Student
</button>

<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ student.editIndex === null ? 'Add Student' : 'Update Student' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <app-form
          [data]="student.data"
          [editIndex]="student.editIndex"
          (save)="student.saveStudent($event); closeModal()">
        </app-form>
      </div>

    </div>
  </div>
</div>

<br /><br />

<app-table
  [data]="tableData"
  (edit)="student.editStudent($event); openModal()"
  (delete)="student.deleteStudent($event)">
</app-table>

<br />

<button class="btn btn-secondary" (click)="goToHome()">
  Back to Dashboard
</button>
