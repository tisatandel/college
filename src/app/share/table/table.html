<table class="table table-bordered mt-3">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Address</th>
      <th>Gender</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of data; let i = index">
      <td><a [routerLink]="['./', item.email]">{{ item.name }}</a></td>
      <td>{{ item.email }}</td>
      <td>{{ item.phone }}</td>
      <td>{{ item.address }}</td>
      <td>{{ item.gender }}</td>
      <td>
        <button class="btn btn-warning me-2" (click)="edit.emit(i)">Edit</button>
        <button class="btn btn-danger" (click)="delete.emit(i)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
