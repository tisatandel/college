<div class="data">
  <div class="lable">Enter Name:</div>
  <div class="input">
    <input type="text" [(ngModel)]="data.name" name="name" required>
  </div>

  <div class="lable">Enter Phone:</div>
  <div class="input">
    <input type="number" [(ngModel)]="data.phone" name="phone" required>
  </div>

  <div class="lable">Enter Email:</div>
  <div class="input">
    <input type="email" [(ngModel)]="data.email" name="email" required>
  </div>

  <div class="lable">Enter Address:</div>
  <div class="input">
    <textarea [(ngModel)]="data.address" name="address" required></textarea>
  </div>

  <div class="lable">Select Gender:</div>
  <div class="input">
    <input type="radio" [(ngModel)]="data.gender" name="gender" value="male" required> Male
    <input type="radio" [(ngModel)]="data.gender" name="gender" value="female" required> Female
  </div>

   <button type="button" (click)="submit()">
    {{ editIndex === null ? 'Save' : 'Update' }}
  </button>

      
</div>
