<div class="container mt-3">
  <div class="mb-3 d-flex align-items-center">
    <label class="me-3 col-3">Enter Name:</label>
    <input class="form-control" type="text" [(ngModel)]="data.name" name="name" required>
  </div>

  <div class="mb-3 d-flex align-items-center">
    <label class="me-3 col-3">Enter Phone:</label>
    <input class="form-control" type="number" [(ngModel)]="data.phone" name="phone" required>
  </div>

  <div class="mb-3 d-flex align-items-center">
    <label class="me-3 col-3">Enter Email:</label>
    <input class="form-control" type="email" [(ngModel)]="data.email" name="email" required>
  </div>

  <div class="mb-3 d-flex align-items-center">
    <label class="me-3 col-3">Enter Address:</label>
    <textarea class="form-control" [(ngModel)]="data.address" name="address" rows="2" required></textarea>
  </div>

  <div class="mb-3 d-flex align-items-center">
    <label class="me-3 col-3">Select Gender:</label>
    <div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" [(ngModel)]="data.gender" name="gender" value="Male" required>
        <label class="form-check-label">Male</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" [(ngModel)]="data.gender" name="gender" value="Female" required>
        <label class="form-check-label">Female</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" [(ngModel)]="data.gender" name="gender" value="Other" required>
        <label class="form-check-label">Other</label>
      </div>
    </div>
  </div>

  <div class="text-center">
    <button class="btn btn-primary" type="button" (click)="submit()">
      {{ editIndex === null ? 'Save' : 'Update' }}
    </button>
  </div>
</div>
